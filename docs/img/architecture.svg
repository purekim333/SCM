<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Inter, 'Segoe UI', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0 L0 0 0 20" fill="none" stroke="#eef2f7" stroke-width="1"/>
    </pattern>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <style>
      .h { font-size: 10.5px; font-weight: 700; letter-spacing: 1.2px; fill: #64748b; }
      .t { font-size: 13px; font-weight: 700; fill: #0f172a; }
      .s { font-size: 10.5px; fill: #64748b; }
      .m { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 10.5px; fill: #334155; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; filter: url(#sh); }
      .lane { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; }
      .pill { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 0.8; }
      .pt { font-size: 9.5px; font-weight: 700; fill: #475569; }
      .num { fill: #1f3a5f; }
      .nt { font-size: 10px; font-weight: 700; fill: #ffffff; }
      .flow { stroke: #334155; stroke-width: 1.4; fill: none; }
      .ret { stroke: #d97706; stroke-width: 1.4; fill: none; stroke-dasharray: 5 3; }
    </style>
  </defs>

  <rect width="1000" height="660" fill="#ffffff"/>
  <rect width="1000" height="660" fill="url(#grid)"/>

  <!-- 제목 -->
  <text x="28" y="38" font-size="19" font-weight="800" fill="#0f172a">System Architecture</text>
  <text x="28" y="58" class="s" font-size="12">SCM Text2SQL Agent · 질문 → SQL로 원인 추적 → 근거가 붙은 리포트 (목표: M4 · 2026-12-18)</text>

  <!-- 범례 -->
  <g transform="translate(700,30)">
    <line x1="0" y1="6" x2="26" y2="6" class="flow" marker-end="url(#a)"/>
    <text x="32" y="10" class="s">request</text>
    <line x1="88" y1="6" x2="114" y2="6" class="ret" marker-end="url(#ao)"/>
    <text x="120" y="10" class="s">response</text>
    <rect x="182" y="-2" width="24" height="16" rx="8" class="pill"/>
    <text x="194" y="10" class="pt" text-anchor="middle">M1</text>
    <text x="212" y="10" class="s">milestone</text>
  </g>

  <!-- ===== 레인 ===== -->
  <rect x="20" y="80" width="150" height="400" rx="10" class="lane"/>
  <text x="36" y="102" class="h">CLIENT</text>
  <rect x="186" y="80" width="170" height="400" rx="10" class="lane"/>
  <text x="202" y="102" class="h">API</text>
  <rect x="372" y="80" width="390" height="400" rx="10" fill="#fbf7f2" stroke="#f1d9bf" stroke-width="1"/>
  <text x="388" y="102" class="h" fill="#b45309">AGENT CORE</text>
  <text x="482" y="102" class="s">Python · Anthropic SDK only (no framework)</text>
  <rect x="778" y="80" width="202" height="400" rx="10" class="lane"/>
  <text x="794" y="102" class="h">DATA &amp; EXTERNAL</text>

  <!-- ===== CLIENT ===== -->
  <rect x="34" y="120" width="122" height="78" rx="8" class="box"/>
  <text x="46" y="142" class="t">Web UI</text>
  <text x="46" y="160" class="s">Vue 3</text>
  <text x="46" y="175" class="s">채팅 · 표 · 차트</text>
  <rect x="120" y="128" width="28" height="16" rx="8" class="pill"/><text x="134" y="140" class="pt" text-anchor="middle">M2</text>

  <rect x="34" y="214" width="122" height="64" rx="8" class="box"/>
  <text x="46" y="236" class="t">CLI</text>
  <text x="46" y="254" class="s">터미널 · 디버깅용</text>
  <rect x="120" y="222" width="28" height="16" rx="8" class="pill"/><text x="134" y="234" class="pt" text-anchor="middle">M1</text>

  <!-- ===== API ===== -->
  <rect x="200" y="120" width="142" height="104" rx="8" class="box"/>
  <text x="212" y="142" class="t">FastAPI</text>
  <rect x="306" y="128" width="28" height="16" rx="8" class="pill"/><text x="320" y="140" class="pt" text-anchor="middle">M2</text>
  <text x="212" y="164" class="m">POST /chat</text>
  <text x="212" y="181" class="m">SSE streaming</text>
  <text x="212" y="198" class="s">인증 · 요청 검증</text>

  <rect x="200" y="240" width="142" height="64" rx="8" class="box"/>
  <text x="212" y="262" class="t">Conversation Store</text>
  <text x="212" y="280" class="s">멀티턴 대화 이력</text>

  <!-- ===== AGENT CORE ===== -->
  <rect x="386" y="120" width="362" height="70" rx="8" class="box" stroke="#d97706"/>
  <text x="400" y="142" class="t">Agent Loop</text>
  <rect x="712" y="128" width="28" height="16" rx="8" class="pill"/><text x="726" y="140" class="pt" text-anchor="middle">M1</text>
  <text x="400" y="162" class="m">while stop_reason == "tool_use":</text>
  <text x="400" y="178" class="m">    run tool → append tool_result → call model</text>

  <text x="400" y="214" class="h">TOOLS</text>
  <rect x="386" y="222" width="86" height="72" rx="8" class="box"/>
  <text x="396" y="242" class="m" font-weight="700">inspect_</text>
  <text x="396" y="256" class="m" font-weight="700">schema</text>
  <text x="396" y="280" class="s">테이블·컬럼</text>

  <rect x="478" y="222" width="86" height="72" rx="8" class="box"/>
  <text x="488" y="242" class="m" font-weight="700">run_sql</text>
  <text x="488" y="266" class="s">조회 실행</text>
  <text x="488" y="280" class="s">결과 요약</text>

  <rect x="570" y="222" width="86" height="72" rx="8" class="box"/>
  <text x="580" y="242" class="m" font-weight="700">lookup_</text>
  <text x="580" y="256" class="m" font-weight="700">semantics</text>
  <text x="580" y="280" class="s">코드 뜻·규칙</text>

  <rect x="662" y="222" width="86" height="72" rx="8" class="box"/>
  <text x="672" y="242" class="m" font-weight="700">web_search</text>
  <text x="672" y="266" class="s">외부 이슈</text>
  <rect x="712" y="272" width="28" height="16" rx="8" class="pill"/><text x="726" y="284" class="pt" text-anchor="middle">M3</text>

  <rect x="386" y="306" width="362" height="40" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1"/>
  <text x="400" y="323" class="t" font-size="11.5">Guardrails</text>
  <text x="400" y="338" class="s">SELECT only · 자동 LIMIT · timeout · read-only 계정 · 비용 상한</text>

  <rect x="386" y="360" width="362" height="104" rx="8" class="box"/>
  <text x="400" y="382" class="t">Report Builder</text>
  <rect x="712" y="368" width="28" height="16" rx="8" class="pill"/><text x="726" y="380" class="pt" text-anchor="middle">M3</text>
  <text x="400" y="400" class="s">원인 사슬 + 근거 SQL + 숫자</text>
  <g font-size="10.5">
    <rect x="400" y="414" width="96" height="22" rx="11" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="448" y="429" fill="#991b1b" text-anchor="middle">부품 입고 지연</text>
    <line x1="498" y1="425" x2="512" y2="425" stroke="#991b1b" stroke-width="1.2" marker-end="url(#a)"/>
    <rect x="514" y="414" width="112" height="22" rx="11" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="570" y="429" fill="#991b1b" text-anchor="middle">이월 (MATERIAL)</text>
    <line x1="628" y1="425" x2="642" y2="425" stroke="#991b1b" stroke-width="1.2" marker-end="url(#a)"/>
    <rect x="644" y="414" width="90" height="22" rx="11" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="689" y="429" fill="#991b1b" text-anchor="middle">출하 지연</text>
  </g>
  <text x="400" y="454" class="s">예시: "S00135는 왜 늦었어?"</text>

  <!-- ===== DATA & EXTERNAL ===== -->
  <rect x="792" y="120" width="174" height="70" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="1" filter="url(#sh)"/>
  <text x="804" y="142" class="t">Claude API</text>
  <text x="804" y="160" class="s">Anthropic Messages API</text>
  <text x="804" y="176" class="s">tool use로 다음 행동 결정</text>

  <rect x="792" y="206" width="174" height="186" rx="8" class="box"/>
  <text x="804" y="228" class="t">MySQL</text>
  <text x="852" y="228" class="s">제조사 DB</text>
  <text x="804" y="248" class="h" font-size="9.5">DOMAIN TABLES</text>
  <text x="804" y="264" class="m">orders</text>
  <text x="804" y="278" class="m">supply_plans</text>
  <text x="804" y="292" class="m">plant_capacities</text>
  <text x="804" y="306" class="m">bom_items</text>
  <text x="804" y="320" class="m">component_receipts</text>
  <text x="804" y="334" class="m">order_snapshots</text>
  <line x1="804" y1="344" x2="954" y2="344" stroke="#e2e8f0"/>
  <text x="804" y="360" class="h" font-size="9.5">SEMANTIC LAYER</text>
  <text x="804" y="376" class="s">코드 테이블 · COMMENT · 뷰</text>

  <rect x="792" y="408" width="174" height="56" rx="8" class="box"/>
  <text x="804" y="430" class="t">Web Search API</text>
  <text x="804" y="448" class="s">항로 · 지정학 뉴스</text>

  <!-- ===== 흐름 ===== -->
  <!-- 1: client → api -->
  <line x1="156" y1="150" x2="198" y2="150" class="flow" marker-end="url(#a)"/>
  <circle cx="177" cy="138" r="8" class="num"/><text x="177" y="141.5" class="nt" text-anchor="middle">1</text>
  <!-- 2: api → agent -->
  <line x1="342" y1="150" x2="384" y2="150" class="flow" marker-end="url(#a)"/>
  <circle cx="363" cy="138" r="8" class="num"/><text x="363" y="141.5" class="nt" text-anchor="middle">2</text>
  <!-- 3: agent ↔ claude -->
  <line x1="748" y1="146" x2="790" y2="146" class="flow" marker-end="url(#a)"/>
  <line x1="790" y1="164" x2="750" y2="164" class="ret" marker-end="url(#ao)"/>
  <circle cx="769" cy="132" r="8" class="num"/><text x="769" y="135.5" class="nt" text-anchor="middle">3</text>
  <!-- 4: loop → tools -->
  <line x1="567" y1="190" x2="567" y2="204" class="flow"/>
  <circle cx="584" cy="204" r="8" class="num"/><text x="584" y="207.5" class="nt" text-anchor="middle">4</text>
  <!-- 5: tools → mysql / web -->
  <line x1="748" y1="252" x2="790" y2="252" class="flow" marker-end="url(#a)"/>
  <path d="M748,282 L768,282 L768,436 L790,436" class="flow" marker-end="url(#a)"/>
  <circle cx="769" cy="236" r="8" class="num"/><text x="769" y="239.5" class="nt" text-anchor="middle">5</text>
  <!-- 6: report → api → client -->
  <path d="M386,412 L271,412 L271,306" class="ret" marker-end="url(#ao)"/>
  <path d="M200,182 L170,182 L170,182 L158,182" class="ret" marker-end="url(#ao)"/>
  <line x1="271" y1="240" x2="271" y2="226" class="ret" marker-end="url(#ao)"/>
  <circle cx="300" cy="412" r="8" fill="#d97706"/><text x="300" y="415.5" class="nt" text-anchor="middle">6</text>

  <!-- 단계 설명 -->
  <g transform="translate(20,498)">
    <rect width="960" height="52" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <g font-size="10.5" fill="#334155">
      <circle cx="18" cy="17" r="7" class="num"/><text x="18" y="20.5" class="nt" text-anchor="middle" font-size="9">1</text>
      <text x="30" y="21">사용자가 질문</text>
      <circle cx="128" cy="17" r="7" class="num"/><text x="128" y="20.5" class="nt" text-anchor="middle" font-size="9">2</text>
      <text x="140" y="21">API가 에이전트 루프 실행</text>
      <circle cx="290" cy="17" r="7" class="num"/><text x="290" y="20.5" class="nt" text-anchor="middle" font-size="9">3</text>
      <text x="302" y="21">Claude가 부를 도구 결정</text>
      <circle cx="448" cy="17" r="7" class="num"/><text x="448" y="20.5" class="nt" text-anchor="middle" font-size="9">4</text>
      <text x="460" y="21">가드레일 통과 후 도구 실행</text>
      <circle cx="622" cy="17" r="7" class="num"/><text x="622" y="20.5" class="nt" text-anchor="middle" font-size="9">5</text>
      <text x="634" y="21">DB · 시맨틱 · 웹 조회 (3~5 반복)</text>
      <circle cx="818" cy="17" r="7" fill="#d97706"/><text x="818" y="20.5" class="nt" text-anchor="middle" font-size="9">6</text>
      <text x="830" y="21">리포트 스트리밍</text>
    </g>
    <text x="18" y="42" class="s">엔진 코드에는 특정 회사의 테이블 이름이 없다. 도메인 지식은 고객 DB의 시맨틱 레이어에서 읽으므로, DB만 바꿔 끼우면 다른 제조사에서도 동작한다.</text>
  </g>

  <!-- 품질·배포 -->
  <text x="28" y="578" class="h">DELIVERY &amp; QUALITY</text>
  <g transform="translate(20,588)">
    <rect x="0" y="0" width="231" height="52" rx="8" class="box"/>
    <text x="12" y="21" class="t" font-size="12">Eval Suite</text>
    <text x="12" y="39" class="s">질문 20개 · 기대 답 자동 채점</text>
    <rect x="243" y="0" width="231" height="52" rx="8" class="box"/>
    <text x="255" y="21" class="t" font-size="12">CI · GitHub Actions</text>
    <text x="255" y="39" class="s">ruff · pytest · eval on every PR</text>
    <rect x="486" y="0" width="231" height="52" rx="8" class="box"/>
    <text x="498" y="21" class="t" font-size="12">Docker Compose</text>
    <text x="498" y="39" class="s">web + api + mysql 셀프호스팅</text>
    <rect x="729" y="0" width="231" height="52" rx="8" class="box"/>
    <text x="741" y="21" class="t" font-size="12">Observability</text>
    <text x="741" y="39" class="s">도구 호출 로그 · 토큰 · 비용</text>
  </g>
</svg>
